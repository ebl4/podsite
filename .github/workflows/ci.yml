name: Static site CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify content and types
        run: npm run verify:content && npm run typecheck
      - name: Build static site
        run: npm run build
      - name: Verify exported files
        run: npm run verify:export
